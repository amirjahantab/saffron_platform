{% load design_tags %}<article class="journal-card"><a class="journal-cover" href="{{ article.get_absolute_url }}">{% if article.cover %}<img src="{{ article.cover.url }}" alt="{{ article.cover_alt }}" width="600" height="375" loading="lazy">{% else %}{% icon 'flower' %}{% endif %}</a><div class="journal-copy"><span>{{ article.category.name }}</span><h3><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3><p>{{ article.excerpt }}</p><a class="text-link" href="{{ article.get_absolute_url }}">خواندن نوشته {% icon 'arrow' %}</a></div></article>
