{% extends 'base.html' %}{% block content %}<div class="site-shell content-page"><div class="reading-width"><div class="page-intro"><span class="eyebrow">پیش از انتخاب</span><h1>پرسش‌های متداول</h1><p>پاسخ‌های روشن برای خریدی آسوده‌تر.</p></div>{% for faq in faqs %}<details class="faq-item"><summary>{{ faq.question }}</summary><div class="prose-content">{{ faq.answer|linebreaks }}</div></details>{% empty %}<p>پرسش‌های شما را از بخش پشتیبانی پاسخ می‌دهیم.</p>{% endfor %}<a class="button button-outline mt-8" href="{% url 'care:inbox' %}">پرسش دیگری دارید؟</a></div></div>{% endblock %}
